<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}}; script-src {{cspSource}};">
<link rel="stylesheet" href="{{styleUri}}">
</head>
<body>
<div class="controls">
  <div class="row">
    <div>
      <label>Port</label>
      <select id="port"></select>
      <button id="refresh-btn" title="Refresh port list">&#x21BB;</button>
    </div>
    <div>
      <label>Baud rate</label>
      <select id="baud"></select>
    </div>
    <div>
      <label>Bits</label>
      <select id="databits"></select>
    </div>
    <div>
      <label class="label-narrow">Stop</label>
      <select id="stopbits" class="select-narrow"></select>
    </div>
    <div>
      <label>Parity</label>
      <select id="parity"></select>
    </div>
    <div>
      <label>Flow</label>
      <select id="flowcontrol"></select>
    </div>
  </div>
  <div class="row">
    <div>
      <label>Term size</label>
      <select id="termsize"></select>
    </div>
    <div>
      <label>Device type</label>
      <select id="device-type"></select>
    </div>
    <div>
      <label>Emulation</label>
      <select id="emulation"></select>
    </div>
    <div>
      <label>Transfer Application</label>
      <select id="transferapplication"></select>
    </div>
    <div>
      <label for="trace-toggle" class="label-auto">
        <input type="checkbox" id="trace-toggle" />
        TX/RX log
      </label>
    </div>
    <div>
      <label for="force-caps" class="label-auto">
        <input type="checkbox" id="force-caps" />
        Force caps
      </label>
    </div>
    <div>
      <label for="text-color" class="label-auto">
        Text color
        <input type="color" id="text-color" />
      </label>
    </div>
    <div id="font-control" hidden>
      <label>Font</label>
      <select id="font-family"></select>
    </div>
  </div>
  <div class="row" id="device-toolbar" hidden>
    <div data-device="microBeast" hidden>
      <label for="auto-write" class="label-auto">
        <input type="checkbox" id="auto-write" />
        AutoWrite
      </label>
    </div>
  </div>
  <div class="row">
    <div>
      <button id="connect-btn">Connect</button>
      <button id="disconnect-btn" class="secondary" disabled>Disconnect</button>
      <button id="clear-btn" class="secondary">Clear</button>
      <button id="reset-btn" class="secondary" disabled>Reset</button>
      <button id="remotccp-send-btn" class="secondary" title="Manually drive the Remote CCP install handshake">Send REMOTCCP</button>
    </div>
    <div id="status" class="disconnected">Disconnected</div>
  </div>
</div>
<hr>
<div id="ready-bar">
  <span id="ready-dot"></span>
  <span id="ready-text">Disconnected</span>
</div>
<div id="output-wrap">
  <div id="output" tabindex="0"></div>
  <div id="busy-overlay" hidden>
    <div class="spinner"></div>
    <div id="busy-overlay-text">Syncing…</div>
  </div>
</div>
<div id="activity-panel">
  <div id="activity-header">Background Activity</div>
  <div id="activity-log"></div>
</div>
<script type="module" src="{{scriptUri}}"></script>
</body>
</html>
